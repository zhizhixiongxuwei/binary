openapi: 3.1.0
info:
  title: BinaryScan internal checker API
  version: 1.1.0
  description: >-
    Checker findings use one-based line numbers and one-based UTF-16 code-unit
    columns. This is the coordinate system consumed directly by Monaco Editor;
    supplementary Unicode characters such as emoji occupy two columns.
paths:
  /v2/java/projects:
    post:
      description: >-
        Create an isolated, bounded Java project context. The immutable manifest,
        run identity and frozen rule selection bind every subsequent upload.
        Files are transported in batches but analyzed in one project call graph.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JavaProjectRequest" }
      responses:
        "200":
          description: Context created; the returned sessionId is required for upload, analysis and release.
        "413": { description: Project input budget exceeded; caller must report reduced cross-method coverage. }
        "429": { description: Project capacity temporarily exhausted. }
  /v2/java/projects/{sessionId}/files:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: string } }
    put:
      description: Upload at most 200 source files, verified against the project manifest. Identical retries are idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/SourceFile" } }
      responses:
        "200": { description: Verified batch accepted. }
        "400": { description: Unknown path, content identity mismatch or invalid batch. }
        "404": { description: Context expired or was released; create a new context. }
  /v2/java/projects/{sessionId}/analyze:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: string } }
    post:
      description: Seal a complete source upload and run bounded project-level analysis. Unresolved calls and exhausted analysis budgets remain explicit.
      responses:
        "200":
          description: Completed or partial Java project result with actual coverage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResponse" }
        "409": { description: Upload is incomplete or analysis is already running. }
        "429": { description: Shared heavy analyzer slot is busy. }
  /v2/java/projects/{sessionId}:
    parameters:
      - { in: path, name: sessionId, required: true, schema: { type: string } }
    delete:
      description: Release the isolated context and temporary sources, including after failure or cancellation.
      responses:
        "200": { description: Context released. }
  /healthz:
    get:
      responses:
        "200":
          description: Checker is ready to accept bounded requests.
  /v1/rules:
    get:
      description: Returns the deployed engine's complete rule registry and its metadata fingerprint. No source files are analyzed.
      responses:
        "200":
          description: Language-specific selectable rules; registry order is stable by ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleCatalog"
  /v1/check:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
      responses:
        "200":
          description: Completed or partial analysis result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
        "400":
          description: Invalid request, empty or unknown rule selection, wrong language, or catalog version mismatch. A malformed selection never falls back to all rules.
components:
  schemas:
    CatalogVersion:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      description: SHA-256 of the complete rule metadata array sorted by ID, encoded as compact UTF-8 JSON with object keys in alphabetical order. Independent of checker-v1 wire protocol version.
    RuleDefinition:
      type: object
      additionalProperties: false
      required: [id, name, description, cwes, severity, language, default_enabled, limitations]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, description: Human-readable Chinese rule name. }
        description: { type: string }
        cwes:
          type: array
          minItems: 1
          items: { type: string, pattern: '^CWE-[0-9]+$' }
        severity: { enum: [critical, high, medium, low, info] }
        language: { enum: [c, java, python] }
        default_enabled: { type: boolean }
        limitations:
          type: array
          items: { type: string }
    RuleCatalog:
      type: object
      additionalProperties: false
      required: [version, language, catalogVersion, rules]
      properties:
        version: { const: checker-v1 }
        language: { enum: [c, java, python] }
        catalogVersion: { $ref: "#/components/schemas/CatalogVersion" }
        rules:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/RuleDefinition" }
    SourceFile:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
          maxLength: 1024
        content:
          type: string
          maxLength: 4194304
    CheckRequest:
      type: object
      additionalProperties: false
      required: [version, projectId, language, files]
      properties:
        version:
          const: checker-v1
        projectId:
          type: string
          maxLength: 64
        language:
          enum: [c, java, python]
        files:
          type: array
          maxItems: 3000
          items:
            $ref: "#/components/schemas/SourceFile"
        ruleIds:
          type: array
          minItems: 1
          maxItems: 100
          description: Omit for all rules (legacy compatibility). Explicit selections must contain only IDs of this engine. Duplicates are normalized and the applied list is sorted.
          items: { type: string, minLength: 1, maxLength: 128 }
        catalogVersion:
          $ref: "#/components/schemas/CatalogVersion"
          description: If provided, must match the deployed registry fingerprint exactly; new callers should always pin this alongside ruleIds.
    Finding:
      type: object
      additionalProperties: false
      required: [ruleId, severity, path, line, title, message]
      properties:
        ruleId: { type: string }
        severity: { enum: [critical, high, medium, low, info] }
        cwe: { type: string }
        path: { type: string }
        line:
          type: integer
          minimum: 1
          description: One-based source line number.
        column:
          type: integer
          minimum: 1
          description: >-
            One-based UTF-16 code-unit offset within line, matching Monaco
            Position.column. Column 1 is before the first code unit and the
            largest valid value is the line's UTF-16 length plus 1. The offset
            must be a Unicode scalar boundary, never between the two surrogate
            code units of a supplementary character.
        title: { type: string }
        message: { type: string }
        evidence: { type: object }
    CheckResponse:
      type: object
      additionalProperties: false
      required: [version, projectId, status, findings, diagnostics, catalogVersion, appliedRuleIds]
      properties:
        version:
          const: checker-v1
        projectId:
          type: string
        status:
          enum: [complete, partial]
        findings:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/Finding"
        diagnostics:
          type: array
          maxItems: 1000
          items: { type: string }
        catalogVersion:
          $ref: "#/components/schemas/CatalogVersion"
        appliedRuleIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          description: Exact normalized execution selection, including the resolved full list for legacy requests. Only these rule evaluators run; common source parsing and shared facts are still computed.
          items: { type: string }
        coverage:
          $ref: "#/components/schemas/JavaCoverage"
        diagnosticDetails:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string, maxLength: 128 }
              path: { type: string, maxLength: 1024 }
              line: { type: integer, minimum: 0 }
              column: { type: integer, minimum: 0 }
              message: { type: string, maxLength: 8192 }
        findingsTruncated: { type: boolean }
        diagnosticsTruncated: { type: boolean }
    JavaCoverage:
      type: object
      required: [totalFiles, parsedFiles, failedFiles, analyzedFiles, totalMethods, analyzedMethods, unresolvedCalls]
      description: >-
        Actual execution counts. parsedFiles + failedFiles equals totalFiles;
        analyzedFiles is at most parsedFiles. Completion is relative to the
        selected scope and model capabilities, not proof of null safety.
      properties:
        totalFiles: { type: integer, minimum: 0, maximum: 20000 }
        parsedFiles: { type: integer, minimum: 0, maximum: 20000 }
        failedFiles: { type: integer, minimum: 0, maximum: 20000 }
        analyzedFiles: { type: integer, minimum: 0, maximum: 20000 }
        totalMethods: { type: integer, minimum: 0 }
        analyzedMethods: { type: integer, minimum: 0 }
        unresolvedCalls: { type: integer, minimum: 0 }
    JavaProjectRequest:
      type: object
      required: [version, projectId, runId, manifestSha256, files]
      properties:
        version: { const: java-project-v1 }
        projectId: { type: string, maxLength: 64 }
        runId: { type: string, maxLength: 64 }
        manifestSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        catalogVersion: { $ref: "#/components/schemas/CatalogVersion" }
        ruleIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string }
        files:
          type: array
          maxItems: 20000
          items:
            type: object
            required: [path, sha256, sizeBytes]
            properties:
              path: { type: string, maxLength: 1024 }
              sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
              sizeBytes: { type: integer, minimum: 0, maximum: 4194304 }

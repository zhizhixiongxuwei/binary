openapi: 3.1.0
info:
  title: BinaryScan internal checker API
  version: 1.0.0
  description: >-
    Checker findings use one-based line numbers and one-based UTF-16 code-unit
    columns. This is the coordinate system consumed directly by Monaco Editor;
    supplementary Unicode characters such as emoji occupy two columns.
paths:
  /healthz:
    get:
      responses:
        "200":
          description: Checker is ready to accept bounded requests.
  /v1/check:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
      responses:
        "200":
          description: Completed or partial analysis result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckResponse"
components:
  schemas:
    SourceFile:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path:
          type: string
          maxLength: 1024
        content:
          type: string
          maxLength: 4194304
    CheckRequest:
      type: object
      additionalProperties: false
      required: [version, projectId, language, files]
      properties:
        version:
          const: checker-v1
        projectId:
          type: string
          maxLength: 64
        language:
          enum: [c, java, python]
        files:
          type: array
          maxItems: 3000
          items:
            $ref: "#/components/schemas/SourceFile"
    Finding:
      type: object
      additionalProperties: false
      required: [ruleId, severity, path, line, title, message]
      properties:
        ruleId: { type: string }
        severity: { enum: [critical, high, medium, low, info] }
        cwe: { type: string }
        path: { type: string }
        line:
          type: integer
          minimum: 1
          description: One-based source line number.
        column:
          type: integer
          minimum: 1
          description: >-
            One-based UTF-16 code-unit offset within line, matching Monaco
            Position.column. Column 1 is before the first code unit and the
            largest valid value is the line's UTF-16 length plus 1. The offset
            must be a Unicode scalar boundary, never between the two surrogate
            code units of a supplementary character.
        title: { type: string }
        message: { type: string }
        evidence: { type: object }
    CheckResponse:
      type: object
      additionalProperties: false
      required: [version, projectId, status, findings, diagnostics]
      properties:
        version:
          const: checker-v1
        projectId:
          type: string
        status:
          enum: [complete, partial]
        findings:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/Finding"
        diagnostics:
          type: array
          maxItems: 1000
          items: { type: string }

services:
  mysql:
    networks:
      - database-net
      - edge-net
    ports:
      - "127.0.0.1:${DEV_MYSQL_PORT:?required}:3306"

  app:
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      BINARY_LISTEN_ADDR: ":8080"
      BINARY_PUBLIC_BASE_URL: http://127.0.0.1:8080
      BINARY_TLS_MODE: http
      BINARY_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://127.0.0.1:5173

name: ${COMPOSE_PROJECT_NAME:?required}

# 数据库连接参数只通过这个锚点注入需要访问 MySQL 的 App 与 Worker；
# 三个 checker 不引用该锚点，因此交付时不会获得数据库账号或业务数据访问能力。
x-db-client: &db-client
  BINARY_DB_HOST: mysql
  BINARY_DB_PORT: "3306"
  BINARY_DB_NAME: ${MYSQL_DATABASE:?required}
  BINARY_DB_USER: ${MYSQL_USER:?required}
  BINARY_DB_PASSWORD: ${MYSQL_PASSWORD:?required}

# 产品容器的共同加固基线：只读根文件系统、非 root 用户、删除 Linux capabilities、
# 禁止提权并限制临时目录和日志尺寸。各服务只额外挂载自己职责所需的数据目录。
x-product-service: &product-service
  platform: ${BINARY_PLATFORM:?required}
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  read_only: true
  user: "${PRODUCT_UID:?required}:${PRODUCT_GID:?required}"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

# checker 仅位于内部 checker-net，通过 HTTP checker-v1 接受 scanner 编排；
# 不发布宿主机端口，也不挂载数据库、原始二进制或持久化业务目录。
x-checker-service: &checker-service
  <<: *product-service
  networks:
    - checker-net
  expose:
    - "8080"
  pids_limit: 256

services:
  # MySQL 持久化任务状态、运行记录、报告索引和审计数据；文件内容不存入数据库。
  mysql:
    platform: ${BINARY_PLATFORM:?required}
    image: ${MYSQL_IMAGE:?required}
    pull_policy: never
    restart: unless-stopped
    networks:
      - database-net
    volumes:
      - ${BINARY_DATA_ROOT:?required}/mysql:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  # App 是唯一面向浏览器开放端口的服务，同时托管 Go API 与嵌入后的 Vue 静态资源。
  app:
    <<: *product-service
    image: ${APP_IMAGE:?required}
    pull_policy: never
    networks:
      - database-net
      - edge-net
    ports:
      - "${APP_BIND_IP:?required}:${APP_PORT:?required}:8080"
    volumes:
      - ${BINARY_DATA_ROOT:?required}/storage:/data/storage
    environment:
      <<: *db-client
      BINARY_VERSION: ${BINARY_VERSION:?required}
      BINARY_ROLE: app
      BINARY_LISTEN_ADDR: ${APP_LISTEN_ADDR:?required}
      BINARY_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?required}
      BINARY_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?required}
      BINARY_INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?required}
      BINARY_INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?required}
      BINARY_STORAGE_ROOT: /data/storage
      BINARY_UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:?required}
    mem_limit: ${APP_MEMORY_LIMIT:?required}
    pids_limit: 256
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/binary-app", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Scanner 负责格式识别、归档一层解析、Trivy 及源码 checker 编排；项目源码只读挂载，
  # finding 和报告等新制品通过 artifacts 目录发布。
  scanner:
    <<: *product-service
    image: ${SCANNER_IMAGE:?required}
    pull_policy: never
    networks:
      - database-net
      - checker-net
    volumes:
      - ${BINARY_DATA_ROOT:?required}/storage/blobs:/data/storage/blobs
      - ${BINARY_DATA_ROOT:?required}/storage/projects:/data/storage/projects:ro
      - ${BINARY_DATA_ROOT:?required}/storage/artifacts:/data/storage/artifacts
      - ${BINARY_DATA_ROOT:?required}/work/scanner:/data/work
    environment:
      <<: *db-client
      BINARY_VERSION: ${BINARY_VERSION:?required}
      BINARY_ROLE: scanner
      BINARY_WORK_ROOT: /data/work
      BINARY_BLOB_ROOT: /data/storage/blobs
      BINARY_PROJECT_ROOT: /data/storage/projects
      BINARY_ARTIFACT_ROOT: /data/storage/artifacts
      BINARY_C_CHECKER_URL: http://c-checker:8080
      BINARY_JAVA_CHECKER_URL: http://java-checker:8080
      BINARY_PYTHON_CHECKER_URL: http://python-checker:8080
      BINARY_TRIVY_PATH: /usr/local/bin/trivy
      BINARY_TRIVY_CACHE_ROOT: /opt/trivy-cache
      BINARY_ARCHIVE_MAX_EXPANDED_BYTES: ${ARCHIVE_MAX_EXPANDED_BYTES:?required}
      BINARY_ARCHIVE_MAX_ENTRIES: ${ARCHIVE_MAX_ENTRIES:?required}
      BINARY_JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:?required}
      BINARY_JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:?required}
      BINARY_JOB_POLL_MILLISECONDS: ${JOB_POLL_MILLISECONDS:?required}
      BINARY_SLOT_SCANNER: ${SLOT_SCANNER:?required}
      BINARY_SLOT_TRIVY: ${SLOT_TRIVY:?required}
      BINARY_SLOT_C_CHECK: ${SLOT_C_CHECK:?required}
      BINARY_SLOT_JAVA_CHECK: ${SLOT_JAVA_CHECK:?required}
      BINARY_SLOT_PYTHON_CHECK: ${SLOT_PYTHON_CHECK:?required}
    mem_limit: ${SCANNER_MEMORY_LIMIT:?required}
    pids_limit: 512
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/binary-scanner", "healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  # 三个反编译 Worker 按工具能力隔离，避免把 Ghidra、JVM 工具和 pycdc 塞入同一镜像；
  # 它们共享数据库任务协议，但只能读取 blob 并写入自己命名空间下的源码项目。
  native-decompiler:
    <<: *product-service
    image: ${NATIVE_DECOMPILER_IMAGE:?required}
    pull_policy: never
    networks:
      - database-net
    volumes:
      - ${BINARY_DATA_ROOT:?required}/storage/blobs:/data/storage/blobs:ro
      - ${BINARY_DATA_ROOT:?required}/storage/projects/native:/data/storage/projects/native
      - ${BINARY_DATA_ROOT:?required}/work/native-decompiler:/data/work
    environment:
      <<: *db-client
      BINARY_VERSION: ${BINARY_VERSION:?required}
      BINARY_ROLE: native-decompiler
      BINARY_WORK_ROOT: /data/work
      BINARY_BLOB_ROOT: /data/storage/blobs
      BINARY_PROJECT_ROOT: /data/storage/projects/native
      BINARY_JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:?required}
      BINARY_JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:?required}
      BINARY_JOB_POLL_MILLISECONDS: ${JOB_POLL_MILLISECONDS:?required}
      BINARY_SLOT_NATIVE: ${SLOT_NATIVE:?required}
      BINARY_GHIDRA_PATH: /opt/ghidra/support/analyzeHeadless
      BINARY_GHIDRA_SCRIPT_ROOT: /opt/binaryscan/ghidra
      BINARY_TOOL_VERSION: "12.1.3"
    mem_limit: ${NATIVE_MEMORY_LIMIT:?required}
    pids_limit: 1024
    stop_grace_period: 60s
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/binary-native-decompiler", "healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s

  jvm-decompiler:
    <<: *product-service
    image: ${JVM_DECOMPILER_IMAGE:?required}
    pull_policy: never
    networks:
      - database-net
    volumes:
      - ${BINARY_DATA_ROOT:?required}/storage/blobs:/data/storage/blobs:ro
      - ${BINARY_DATA_ROOT:?required}/storage/projects/jvm:/data/storage/projects/jvm
      - ${BINARY_DATA_ROOT:?required}/work/jvm-decompiler:/data/work
    environment:
      <<: *db-client
      BINARY_VERSION: ${BINARY_VERSION:?required}
      BINARY_ROLE: jvm-decompiler
      BINARY_WORK_ROOT: /data/work
      BINARY_BLOB_ROOT: /data/storage/blobs
      BINARY_PROJECT_ROOT: /data/storage/projects/jvm
      BINARY_JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:?required}
      BINARY_JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:?required}
      BINARY_JOB_POLL_MILLISECONDS: ${JOB_POLL_MILLISECONDS:?required}
      BINARY_SLOT_JVM: ${SLOT_JVM:?required}
      BINARY_JAVA_PATH: /opt/java/openjdk/bin/java
      BINARY_VINEFLOWER_JAR: /opt/bytecode-tools/vineflower/vineflower.jar
      BINARY_CFR_JAR: /opt/bytecode-tools/cfr/cfr.jar
      BINARY_JADX_JAR: /opt/bytecode-tools/jadx/lib/jadx-all.jar
      BINARY_TOOL_VERSION: vineflower-1.12.0+cfr-0.152+jadx-1.5.6
    mem_limit: ${JVM_MEMORY_LIMIT:?required}
    pids_limit: 512
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/binary-jvm-decompiler", "healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 45s

  pyc-decompiler:
    <<: *product-service
    image: ${PYC_DECOMPILER_IMAGE:?required}
    pull_policy: never
    networks:
      - database-net
    volumes:
      - ${BINARY_DATA_ROOT:?required}/storage/blobs:/data/storage/blobs:ro
      - ${BINARY_DATA_ROOT:?required}/storage/projects/pyc:/data/storage/projects/pyc
      - ${BINARY_DATA_ROOT:?required}/work/pyc-decompiler:/data/work
    environment:
      <<: *db-client
      BINARY_VERSION: ${BINARY_VERSION:?required}
      BINARY_ROLE: pyc-decompiler
      BINARY_WORK_ROOT: /data/work
      BINARY_BLOB_ROOT: /data/storage/blobs
      BINARY_PROJECT_ROOT: /data/storage/projects/pyc
      BINARY_JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:?required}
      BINARY_JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:?required}
      BINARY_JOB_POLL_MILLISECONDS: ${JOB_POLL_MILLISECONDS:?required}
      BINARY_SLOT_PYC: ${SLOT_PYC:?required}
      BINARY_PYCDC_PATH: /opt/bytecode-tools/pycdc/pycdc
      BINARY_TOOL_VERSION: pycdc-b428976
    mem_limit: ${PYC_MEMORY_LIMIT:?required}
    pids_limit: 256
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/binary-pyc-decompiler", "healthcheck"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 20s

  c-checker:
    <<: *checker-service
    image: ${C_CHECKER_IMAGE:?required}
    pull_policy: never
    mem_limit: ${C_CHECKER_MEMORY_LIMIT:?required}
    environment:
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /healthz HTTP/1.0\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  java-checker:
    <<: *checker-service
    image: ${JAVA_CHECKER_IMAGE:?required}
    pull_policy: never
    mem_limit: ${JAVA_CHECKER_MEMORY_LIMIT:?required}
    environment:
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /healthz HTTP/1.0\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  python-checker:
    <<: *checker-service
    image: ${PYTHON_CHECKER_IMAGE:?required}
    pull_policy: never
    mem_limit: ${PYTHON_CHECKER_MEMORY_LIMIT:?required}
    environment:
      SERVER_PORT: "8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

networks:
  # database-net 只承载数据库访问；edge-net 承载 App 对外入口；checker-net 标记为
  # internal，容器无法经该网络直接访问外部地址，降低无状态检测器的权限面。
  database-net:
    internal: true
  checker-net:
    internal: true
  edge-net:
